<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Pattern & Loss Analyzer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #ffffff; padding: 10px; text-align: center; }
        .container { max-width: 100%; width: 100%; margin: 0 auto; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        h1 { color: #00e676; margin-bottom: 5px; font-size: 20px; }
        p { color: #bbb; font-size: 12px; margin-bottom: 15px; }
        
        /* Mobile Optimized Number Pad */
        .number-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
        .num-btn { padding: 12px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: #fff; transition: 0.1s; }
        .num-btn:active { transform: scale(0.92); }
        .red { background: #e53935; }
        .green { background: #43a047; }
        .violet { background: #8e24aa; }

        /* Dashboard Grid for Mobile */
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .card { background: #2a2a2a; padding: 12px; border-radius: 8px; border: 1px solid #333; text-align: center; }
        .card h3 { font-size: 11px; color: #aaa; margin-bottom: 5px; letter-spacing: 0.5px; }
        .card .val { font-size: 18px; font-weight: bold; }
        
        .pred-big { color: #ff9800; }
        .pred-small { color: #29b6f6; }
        .win { color: #4caf50; }
        .loss { color: #f44336; }

        .analysis-box { background: #252525; padding: 12px; border-radius: 8px; text-align: left; margin-bottom: 15px; border-left: 4px solid #00e676; font-size: 13px; }
        .analysis-box h4 { margin-bottom: 4px; color: #00e676; font-size: 13px; }

        /* Table container for responsiveness */
        .table-container { max-height: 250px; overflow-y: auto; border-radius: 8px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 8px 6px; border-bottom: 1px solid #333; text-align: center; }
        th { background: #2a2a2a; color: #888; position: sticky; top: 0; z-index: 1; }
        
        .tag-big { color: #ff9800; font-weight: bold; }
        .tag-small { color: #29b6f6; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Pattern & Loss Analyzer</h1>
    <p>Tap result number to calculate prediction.</p>

    <!-- Number Pad -->
    <div class="number-pad">
        <button class="num-btn violet" onclick="addRound(0)">0</button>
        <button class="num-btn green" onclick="addRound(1)">1</button>
        <button class="num-btn red" onclick="addRound(2)">2</button>
        <button class="num-btn green" onclick="addRound(3)">3</button>
        <button class="num-btn red" onclick="addRound(4)">4</button>
        <button class="num-btn violet" onclick="addRound(5)">5</button>
        <button class="num-btn red" onclick="addRound(6)">6</button>
        <button class="num-btn green" onclick="addRound(7)">7</button>
        <button class="num-btn red" onclick="addRound(8)">8</button>
        <button class="num-btn green" onclick="addRound(9)">9</button>
    </div>

    <!-- Dashboard Cards -->
    <div class="dashboard">
        <div class="card">
            <h3>NEXT PREDICTION</h3>
            <div id="prediction" class="val">-</div>
        </div>
        <div class="card">
            <h3>TOTAL ROUNDS</h3>
            <div id="total-rounds" class="val">0</div>
        </div>
        <div class="card">
            <h3>ACCURACY</h3>
            <div id="accuracy" class="val">0%</div>
        </div>
        <div class="card">
            <h3>LAST CATEGORY</h3>
            <div id="streak" class="val">-</div>
        </div>
    </div>

    <!-- Analysis Box -->
    <div class="analysis-box">
        <h4>Analysis Note:</h4>
        <div id="analysis-text">Enter rounds to start pattern recognition.</div>
    </div>

    <!-- History Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Rnd</th>
                    <th>No</th>
                    <th>Cat</th>
                    <th>Pred</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="history-table">
            </tbody>
        </table>
    </div>
</div>

<script>
    let history = [];
    let wins = 0;
    let losses = 0;
    let nextPrediction = null;

    function getCategory(num) {
        return num <= 4 ? 'SMALL' : 'BIG';
    }

    function addRound(number) {
        const category = getCategory(number);
        let status = 'N/A';

        if (nextPrediction) {
            if (nextPrediction === category) {
                status = 'WIN';
                wins++;
            } else {
                status = 'LOSS';
                losses++;
            }
        }

        const roundData = {
            round: history.length + 1,
            number: number,
            category: category,
            predicted: nextPrediction || 'WAITING',
            status: status
        };

        history.push(roundData);
        nextPrediction = calculateNextPrediction();
        updateUI();
    }

    function calculateNextPrediction() {
        if (history.length < 2) return 'BIG';

        const categories = history.map(h => h.category);
        const total = categories.length;
        
        const last1 = categories[total - 1];
        const last2 = categories[total - 2];
        const last3 = total >= 3 ? categories[total - 3] : null;

        if (last1 === last2 && last2 === last3) {
            return last1;
        }

        if (last1 !== last2 && last2 === last3) {
            return last1 === 'BIG' ? 'SMALL' : 'BIG';
        }

        const recent = categories.slice(-10);
        const bigCount = recent.filter(c => c === 'BIG').length;
        const smallCount = recent.filter(c => c === 'SMALL').length;

        if (bigCount > smallCount) return 'BIG';
        if (smallCount > bigCount) return 'SMALL';

        return last1 === 'BIG' ? 'SMALL' : 'BIG';
    }

    function updateUI() {
        const tbody = document.getElementById('history-table');
        tbody.innerHTML = '';
        
        [...history].reverse().forEach(row => {
            const tr = document.createElement('tr');
            const catClass = row.category === 'BIG' ? 'tag-big' : 'tag-small';
            const statusClass = row.status === 'WIN' ? 'win' : (row.status === 'LOSS' ? 'loss' : '');
            
            tr.innerHTML = `
                <td>#${row.round}</td>
                <td><b>${row.number}</b></td>
                <td class="${catClass}">${row.category}</td>
                <td>${row.predicted}</td>
                <td class="${statusClass}"><b>${row.status}</b></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('total-rounds').innerText = history.length;
        
        const predElem = document.getElementById('prediction');
        predElem.innerText = nextPrediction;
        predElem.className = nextPrediction === 'BIG' ? 'val pred-big' : 'val pred-small';

        const totalEvaluated = wins + losses;
        const accuracy = totalEvaluated > 0 ? Math.round((wins / totalEvaluated) * 100) : 0;
        document.getElementById('accuracy').innerText = `${accuracy}% (${wins}W/${losses}L)`;

        updateAnalysisText();
    }

    function updateAnalysisText() {
        const textElem = document.getElementById('analysis-text');
        if (history.length === 0) {
            textElem.innerText = "Tap buttons above to record round results.";
            return;
        }

        const recentLosses = history.slice(-3).filter(h => h.status === 'LOSS').length;
        let note = "";

        if (recentLosses >= 2) {
            note = "⚠️ High volatility (Multiple Losses). Wait 1-2 rounds.";
        } else {
            const categories = history.map(h => h.category);
            const last = categories[categories.length - 1];
            let streakCount = 0;
            
            for (let i = categories.length - 1; i >= 0; i--) {
                if (categories[i] === last) streakCount++;
                else break;
            }

            if (streakCount >= 3) {
                note = `🔥 Strong Trend (${streakCount}x ${last}): Following continuous pattern.`;
            } else {
                note = "✅ Normal Pattern: Using frequency & ABAB evaluation.";
            }
        }

        document.getElementById('streak').innerText = `${history[history.length - 1].category}`;
        textElem.innerText = note;
    }
</script>

</body>
</html>
